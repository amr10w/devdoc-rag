[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devdoc-rag"
version = "0.1.0"
description = "DevDoc RAG - Technical Documentation Q&A and Retrieval Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=1.26.0",
    "ollama>=0.4.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
]

[project.scripts]
devdoc-ground-truth = "src.evaluation.generate_ground_truth:main"
devdoc-ingest = "src.ingestion.ingest_qdrant:main"
devdoc-eval-retrieval = "src.evaluation.evaluate_retrieval:main"
devdoc-eval-llm = "src.evaluation.evaluate_llm:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
